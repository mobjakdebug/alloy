name: Molab Pair Runner

on:
  workflow_dispatch:
    inputs:
      script_path:
        description: "Path to Python script to run in Molab scratchpad"
        required: false
        default: "molab_runner/task.py"
  push:
    branches:
      - "arena/**"
    paths:
      - "molab_runner/task.py"

permissions:
  contents: write

jobs:
  run-molab-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check secrets & runner script
        id: sec
        env:
          MOLAB_URL: ${{ secrets.MOLAB_URL }}
          MOLAB_TOKEN: ${{ secrets.MOLAB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SCRIPT_PATH: ${{ github.event.inputs.script_path || 'molab_runner/task.py' }}
        run: |
          if [ -z "$MOLAB_URL" ] || [ -z "$MOLAB_TOKEN" ]; then
            echo "::error::Missing MOLAB_URL or MOLAB_TOKEN GitHub Actions secret."
            echo "Add MOLAB_URL and MOLAB_TOKEN in Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -n "$HF_TOKEN" ]; then
            echo "hf_token_set=true" >> "$GITHUB_OUTPUT"
          else
            echo "hf_token_set=false" >> "$GITHUB_OUTPUT"
          fi
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "::error::Runner script not found: $SCRIPT_PATH"
            exit 1
          fi

      - name: Fetch marimo-pair skill
        run: |
          git clone --depth 1 https://github.com/marimo-team/marimo-pair.git /tmp/marimo-pair

      - name: Execute in Molab kernel
        id: exec
        env:
          MOLAB_URL: ${{ secrets.MOLAB_URL }}
          MARIMO_TOKEN: ${{ secrets.MOLAB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SCRIPT_PATH: ${{ github.event.inputs.script_path || 'molab_runner/task.py' }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            python3 - <<'PY'
          import base64, os, pathlib
          b64 = base64.b64encode(os.environ["HF_TOKEN"].strip().encode("utf-8")).decode("ascii")
          code = (
              "import base64, os\n"
              "from pathlib import Path\n"
              f"_t = base64.b64decode({b64!r}).decode('utf-8')\n"
              "Path('/marimo/.config').mkdir(parents=True, exist_ok=True)\n"
              "_p = Path('/marimo/.config/hf_token')\n"
              "_p.write_text(_t, encoding='utf-8')\n"
              "os.chmod(_p, 0o600)\n"
              "os.environ['HF_TOKEN'] = _t\n"
              "os.environ['HUGGINGFACE_HUB_TOKEN'] = _t\n"
          )
          pathlib.Path("/tmp/sync_hf.py").write_text(code, encoding="utf-8")
          PY
            bash /tmp/marimo-pair/skills/marimo-pair/scripts/execute-code.sh \
              --url "$MOLAB_URL" \
              /tmp/sync_hf.py > /dev/null 2>&1 || true
            rm -f /tmp/sync_hf.py
          fi
          set +e
          bash /tmp/marimo-pair/skills/marimo-pair/scripts/execute-code.sh \
            --url "$MOLAB_URL" \
            "$SCRIPT_PATH" > raw_output.log 2>&1
          rc=$?
          set -e
          python3 - <<'PY'
          import os, pathlib
          txt = pathlib.Path("raw_output.log").read_text(errors="replace")
          for key in ("MARIMO_TOKEN", "MOLAB_URL", "HF_TOKEN"):
              val = os.environ.get(key, "")
              if val:
                  txt = txt.replace(val, f"[REDACTED_{key}]")
          pathlib.Path("clean_output.log").write_text(txt)
          print(txt)
          PY
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Post execution output as commit comment
        if: always() && hashFiles('clean_output.log') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXEC_RC: ${{ steps.exec.outputs.exit_code }}
          HF_SET: ${{ steps.sec.outputs.hf_token_set }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          txt = pathlib.Path("clean_output.log").read_text(errors="replace")
          if len(txt) > 60000:
              txt = txt[:30000] + "\n\n... [TRUNCATED] ...\n\n" + txt[-30000:]
          rc = os.environ.get("EXEC_RC", "?")
          hf_set = os.environ.get("HF_SET", "?")
          body = f"**Molab Pair Runner** (exit_code={rc}, gh_hf_token={hf_set})\n\n```text\n{txt}\n```"
          subprocess.run([
              "gh", "api",
              f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
              "-f", f"body={body}",
          ], check=True)
          PY
